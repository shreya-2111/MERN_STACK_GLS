<!DOCTYPE html>
<html>
<head>
    <title>Positive Negative Zero</title>
</head>
<body>

<script>

let number = Number(prompt("Enter a number"));

if (number > 0) {
    alert("Number is Positive");
}
else if (number < 0) {
    alert("Number is Negative");
}
else {
    alert("Number is Zero");
}

</script>

</body>
</html>
