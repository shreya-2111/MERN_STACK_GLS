<!DOCTYPE html>
<html>
<head>
    <title>Even Odd</title>
</head>
<body>

<h2>Even and Odd Numbers</h2>

<script>

for (let currentNumber = 1; currentNumber <= 15; currentNumber++) {

    if (currentNumber % 2 == 0) {
        document.write(currentNumber + " is even <br>");
    }
    else {
        document.write(currentNumber + " is odd <br>");
    }

}

</script>

</body>
</html>
