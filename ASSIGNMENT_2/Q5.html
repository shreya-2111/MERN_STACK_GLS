<!DOCTYPE html>
<html>
<head>
    <title>Reverse Words</title>
</head>
<body>

<script>

function reverseWords(sentence) {

    let wordArray = sentence.split(" ");

    let reversedSentence = wordArray.reverse().join(" ");

    return reversedSentence;
}

console.log(reverseWords("Hello World"));

</script>

</body>
</html>
